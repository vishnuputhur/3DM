<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VTSoft - Shell Plate Forming Studio</title>
  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; color: #f8fafc; touch-action: none; }
    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }

    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px);
      padding: 8px 12px; border-radius: 10px; border: 1px solid #1e293b; z-index: 15;
    }
    .top-left { display: flex; align-items: center; gap: 8px; }
    .btn-back {
      background: #1e293b; color: #f8fafc; border: 1px solid #334155;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-decoration: none;
    }
    .top-bar h1 { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .badge { font-size: 11px; background: #0369a1; padding: 3px 8px; border-radius: 6px; font-weight: 600; max-width: 135px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .mode-banner {
      position: absolute; top: 56px; left: 10px;
      background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981;
      color: #6ee7b7; padding: 6px 10px; border-radius: 8px;
      font-size: 11px; font-weight: 600; z-index: 14; max-width: 52%; backdrop-filter: blur(6px);
    }

    /* Side Vertical Offset Bar */
    .side-offset-panel {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid #334155; border-radius: 12px; padding: 8px 6px;
      z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .side-offset-panel.hidden { display: none; }
    .offset-title { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
    .offset-val { font-size: 11px; font-weight: 800; color: #facc15; font-family: monospace; }
    .offset-step-btn {
      width: 28px; height: 28px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .vertical-slider-wrap { height: 110px; width: 28px; display: flex; align-items: center; justify-content: center; }
    #side-offset-slider { width: 105px; height: 6px; transform: rotate(-90deg); accent-color: #0284c7; }

    .probe-hud {
      position: absolute; top: 56px; right: 10px;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px);
      border: 1px solid #0284c7; border-radius: 10px; padding: 8px 12px;
      z-index: 14; text-align: right; pointer-events: none; transition: opacity 0.2s; min-width: 162px;
    }
    .probe-hud.hidden { opacity: 0; }
    .probe-label { font-size: 9px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
    .probe-val { font-size: 22px; font-weight: 800; color: #facc15; font-family: monospace; line-height: 1.1; }
    .probe-grid {
      margin-top: 6px; padding-top: 6px; border-top: 1px solid #1e293b;
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 11px; font-family: monospace; text-align: left;
    }
    .probe-grid span { color: #94a3b8; }
    .probe-grid b { color: #38bdf8; float: right; }

    .bottom-dock {
      position: absolute; bottom: 14px; left: 10px; right: 10px;
      display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; z-index: 15;
    }
    .dock-btn {
      flex: 1; min-width: 75px; max-width: 145px;
      background: rgba(15, 23, 42, 0.94); color: #f8fafc; border: 1px solid #334155;
      padding: 10px 8px; border-radius: 10px; font-size: 12px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .dock-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .dock-btn.corner-active { background: #059669; border-color: #34d399; color: #fff; }

    /* Magnifier Loupe */
    #magnifier {
      position: fixed; width: 116px; height: 116px; border-radius: 50%;
      border: 3px solid #38bdf8; box-shadow: 0 8px 25px rgba(0,0,0,0.75);
      pointer-events: none; z-index: 40; display: none; overflow: hidden;
      background: #090d16; transform: translate(-50%, -125%);
    }
    #magnifier canvas { width: 100%; height: 100%; display: block; }
    #magnifier::after {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(to right, transparent 49%, rgba(250,204,21,0.85) 49.5%, rgba(250,204,21,0.85) 50.5%, transparent 51%),
        linear-gradient(to bottom, transparent 49%, rgba(250,204,21,0.85) 49.5%, rgba(250,204,21,0.85) 50.5%, transparent 51%);
    }

    /* Offset Arrow Callout Labels */
    .corner-callout {
      position: absolute; pointer-events: none; z-index: 12;
      display: flex; align-items: center; transform: translate(6px, -22px);
    }
    .callout-arrow {
      width: 14px; height: 1.5px; background: #10b981;
      transform: rotate(-35deg); transform-origin: left center; margin-right: 2px;
    }
    .callout-tag {
      background: rgba(5, 150, 105, 0.92); color: #fff; border: 1px solid #a7f3d0;
      padding: 1px 5px; border-radius: 4px; font-size: 10px; font-family: monospace; font-weight: 800;
    }
    .edge-label {
      position: absolute; background: rgba(9, 13, 22, 0.85); color: #facc15;
      border: 1px solid #10b981; padding: 1px 5px; border-radius: 4px;
      font-size: 10px; font-family: monospace; font-weight: 700;
      pointer-events: none; transform: translate(-50%, -50%); z-index: 11; white-space: nowrap;
    }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 25; display: none; }
    .drawer-backdrop.open { display: block; }
    .settings-drawer {
      position: fixed; bottom: 0; left: 0; right: 0; max-height: 78vh;
      background: #0f172a; border-top: 1px solid #334155; border-radius: 18px 18px 0 0;
      padding: 16px; z-index: 30; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s ease-out;
    }
    .settings-drawer.open { transform: translateY(0); }
    @media (min-width: 768px) {
      .settings-drawer {
        left: 65px; right: auto; bottom: auto; top: 62px; width: 345px;
        border-radius: 14px; border: 1px solid #334155; transform: translateX(-130%);
      }
      .settings-drawer.open { transform: translateX(0); }
    }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #1e293b; }
    .drawer-header h2 { font-size: 13px; color: #38bdf8; text-transform: uppercase; }
    .btn-close-drawer { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 11px; margin-bottom: 4px; color: #94a3b8; }
    .input-group input[type="number"], .input-group select { width: 100%; padding: 9px 10px; background: #090d16; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 13px; font-family: monospace; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; }
    .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .btn-danger { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }
    .tmpl-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .tmpl-item { display: flex; justify-content: space-between; align-items: center; background: #090d16; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; font-size: 12px; }
    .tmpl-dxf-btn { background: #059669; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; }
    #touch-pin { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #facc15; background: rgba(250, 204, 21, 0.5); transform: translate(-50%, -50%); pointer-events: none; display: none; z-index: 13; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-left">
      <a href="index.html" class="btn-back">⬅ Viewer</a>
      <h1>📐 Forming Studio</h1>
    </div>
    <span class="badge" id="plate-badge">Plate</span>
  </div>

  <div class="mode-banner" id="mode-banner">📍 Zoom in, touch & release on Corner 1 of 4</div>

  <!-- Side Plane Offset Control -->
  <div class="side-offset-panel" id="side-offset-panel">
    <div class="offset-title">Offset</div>
    <div class="offset-val" id="side-offset-val">0mm</div>
    <button class="offset-step-btn" id="btn-offset-up">+</button>
    <div class="vertical-slider-wrap">
      <input type="range" id="side-offset-slider" min="0" max="500" value="0" step="5" />
    </div>
    <button class="offset-step-btn" id="btn-offset-down">−</button>
  </div>

  <div class="probe-hud" id="probe-hud">
    <div class="probe-label">Plane Drop Depth</div>
    <div class="probe-val" id="hud-probe-depth">0.0 mm</div>
    <div class="probe-grid">
      <div><span>Left:</span> <b id="hud-dist-left">-</b></div>
      <div><span>Right:</span> <b id="hud-dist-right">-</b></div>
      <div><span>Top:</span> <b id="hud-dist-top">-</b></div>
      <div><span>Bot:</span> <b id="hud-dist-bot">-</b></div>
    </div>
  </div>

  <div id="magnifier"><canvas id="mag-canvas" width="116" height="116"></canvas></div>
  <div id="labels-layer"></div>
  <div id="touch-pin"></div>

  <div class="bottom-dock">
    <button class="dock-btn" id="btn-mode-measure">📏 Measure</button>
    <button class="dock-btn corner-active" id="btn-mode-corners">📍 Pick 4 Corners</button>
    <button class="dock-btn" id="btn-toggle-hud">👁️ Hide HUD</button>
    <button class="dock-btn" id="btn-open-settings">⚙️ Settings / DXF</button>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <div class="settings-drawer" id="settings-drawer">
    <div class="drawer-header">
      <h2>⚙️ Forming & Template Settings</h2>
      <button class="btn-close-drawer" id="btn-close-settings">✕ Close</button>
    </div>

    <div class="input-group">
      <label>Corner Selection Tools</label>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-undo-corner">↩ Undo Corner</button>
        <button class="btn btn-danger" id="btn-clear-corners">🗑️ Clear All</button>
      </div>
    </div>

    <div class="input-group">
      <label>Template Slice Direction</label>
      <select id="inp-slice-axis">
        <option value="u">Along Length (C1 → C2)</option>
        <option value="v">Along Width (C1 → C4)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Station Pitch (mm)</label>
      <input type="number" id="inp-interval" value="300" step="50" min="100" max="1500" />
    </div>

    <div class="input-group">
      <label>Wood Base Margin for CNC (mm)</label>
      <input type="number" id="inp-wood-margin" value="100" min="50" max="300" />
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-recalc">⚡ Update Templates</button>
      <button class="btn btn-secondary" id="btn-toggle-plane">🌐 Mesh On/Off</button>
    </div>

    <div style="margin-top:16px; border-top:1px solid #1e293b; padding-top:12px;">
      <h2 style="font-size:12px; color:#94a3b8; margin-bottom:8px;">DOWNLOAD 2D WOOD CNC DXF</h2>
      <div class="tmpl-list" id="template-export-list"></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let scene, camera, renderer, controls;
    let plateMesh = null, datumPlaneMesh = null;
    let stationsGroup = new THREE.Group(), stringGroup = new THREE.Group(), probeGroup = new THREE.Group();
    let generatedTemplates = [];
    let interactionMode = 'corners';
    let manualCorners = [];
    let htmlLabels = [];
    let planeOffset = 0;
    let lastHitPt = null, lastScreenX = 0, lastScreenY = 0;

    let localFrame = {
      C1: new THREE.Vector3(), C2: new THREE.Vector3(), C3: new THREE.Vector3(), C4: new THREE.Vector3(),
      center: new THREE.Vector3(), uDir: new THREE.Vector3(), vDir: new THREE.Vector3(), nDir: new THREE.Vector3(),
      length: 0, width: 0
    };

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090d16);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 10, 500000);
      camera.up.set(0, 0, 1);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5000, -5000, 8000);
      scene.add(dirLight);

      scene.add(stationsGroup);
      scene.add(stringGroup);
      scene.add(probeGroup);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      loadPlateData();
      setupCanvasInteractions();
      setupUI();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      updateHTMLLabels();
      renderer.render(scene, camera);
    }

    function loadPlateData() {
      let raw = localStorage.getItem('vt_forming_plate_data') || localStorage.getItem('active_forming_part');
      if (!raw) {
        document.getElementById('plate-badge').innerText = 'No Plate';
        return;
      }
      let data = JSON.parse(raw);
      document.getElementById('plate-badge').innerText = data.name || 'Shell Plate';

      const floatArr = (data.vertices instanceof Float32Array) ? data.vertices : new Float32Array(data.vertices);
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(floatArr, 3));
      geom.computeVertexNormals();

      plateMesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
        color: (data.color !== undefined) ? data.color : 0x38bdf8,
        roughness: 0.35, metalness: 0.25, side: THREE.DoubleSide
      }));
      scene.add(plateMesh);

      geom.computeBoundingBox();
      const bbox = geom.boundingBox;
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1000;

      controls.target.copy(center);
      camera.position.set(center.x + maxDim * 0.7, center.y - maxDim * 0.7, center.z + maxDim * 0.8);
      controls.update();
    }

    function applyCornersToFrame(corners) {
      if (datumPlaneMesh) { scene.remove(datumPlaneMesh); datumPlaneMesh = null; }
      while (stationsGroup.children.length > 0) stationsGroup.remove(stationsGroup.children[0]);

      if (corners.length < 4) {
        drawPinsAndStrings(corners, 0);
        return;
      }

      const [c1, c2, c3, c4] = corners;
      localFrame.C1.copy(c1); localFrame.C2.copy(c2); localFrame.C3.copy(c3); localFrame.C4.copy(c4);
      localFrame.center.copy(c1).add(c2).add(c3).add(c4).multiplyScalar(0.25);

      const u1 = new THREE.Vector3().subVectors(c2, c1);
      const u2 = new THREE.Vector3().subVectors(c3, c4);
      localFrame.uDir.copy(u1).add(u2).normalize();

      const v1 = new THREE.Vector3().subVectors(c4, c1);
      const v2 = new THREE.Vector3().subVectors(c3, c2);
      localFrame.vDir.copy(v1).add(v2).normalize();

      localFrame.nDir.crossVectors(localFrame.uDir, localFrame.vDir).normalize();
      if (localFrame.nDir.z < 0) localFrame.nDir.negate();
      localFrame.vDir.crossVectors(localFrame.nDir, localFrame.uDir).normalize();

      localFrame.length = (u1.length() + u2.length()) * 0.5;
      localFrame.width = (v1.length() + v2.length()) * 0.5;

      buildExact4CornerMesh();
      generateStations();
    }

    function buildExact4CornerMesh() {
      if (datumPlaneMesh) { scene.remove(datumPlaneMesh); datumPlaneMesh = null; }
      if (manualCorners.length < 4) return;

      const offsetVec = localFrame.nDir.clone().multiplyScalar(planeOffset);
      const p1 = localFrame.C1.clone().add(offsetVec);
      const p2 = localFrame.C2.clone().add(offsetVec);
      const p3 = localFrame.C3.clone().add(offsetVec);
      const p4 = localFrame.C4.clone().add(offsetVec);

      drawPinsAndStrings(manualCorners, planeOffset);

      const segsU = 10, segsV = 10;
      const vertices = [], indices = [];

      for (let iv = 0; iv <= segsV; iv++) {
        const v = iv / segsV;
        const leftPt = new THREE.Vector3().lerpVectors(p1, p4, v);
        const rightPt = new THREE.Vector3().lerpVectors(p2, p3, v);
        for (let iu = 0; iu <= segsU; iu++) {
          const u = iu / segsU;
          const pt = new THREE.Vector3().lerpVectors(leftPt, rightPt, u);
          vertices.push(pt.x, pt.y, pt.z);
        }
      }

      for (let iv = 0; iv < segsV; iv++) {
        for (let iu = 0; iu < segsU; iu++) {
          const a = iv * (segsU + 1) + iu;
          const b = a + 1;
          const c = (iv + 1) * (segsU + 1) + iu;
          const d = c + 1;
          indices.push(a, b, d, a, d, c);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setIndex(indices);

      datumPlaneMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({
        color: 0x0284c7, wireframe: true, transparent: true, opacity: 0.45
      }));
      scene.add(datumPlaneMesh);
    }

    function drawPinsAndStrings(corners, offsetVal) {
      while (stringGroup.children.length > 0) stringGroup.remove(stringGroup.children[0]);
      document.getElementById('labels-layer').innerHTML = '';
      htmlLabels = [];

      if (corners.length === 0) return;

      const offsetVec = localFrame.nDir.clone().multiplyScalar(offsetVal);
      const lifted = corners.map(c => (corners.length === 4 ? c.clone().add(offsetVec) : c.clone()));

      corners.forEach((basePt, idx) => {
        const topPt = lifted[idx];
        const pinDot = new THREE.Mesh(
          new THREE.SphereGeometry(6, 10, 10),
          new THREE.MeshBasicMaterial({ color: 0xfacc15, depthTest: false })
        );
        pinDot.position.copy(basePt);
        stringGroup.add(pinDot);

        if (corners.length === 4 && offsetVal > 0) {
          stringGroup.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([basePt, topPt]),
            new THREE.LineBasicMaterial({ color: 0xfacc15, depthTest: false })
          ));
        }

        const el = document.createElement('div');
        el.className = 'corner-callout';
        el.innerHTML = `<div class="callout-arrow"></div><div class="callout-tag">C${idx + 1}</div>`;
        document.getElementById('labels-layer').appendChild(el);
        htmlLabels.push({ el, pos3D: basePt.clone() });
      });

      if (lifted.length >= 2) {
        const linePts = [...lifted];
        if (lifted.length === 4) linePts.push(lifted[0]);

        stringGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(linePts),
          new THREE.LineBasicMaterial({ color: 0x10b981, linewidth: 3, depthTest: false })
        ));

        for (let i = 0; i < linePts.length - 1; i++) {
          const dist = linePts[i].distanceTo(linePts[i + 1]);
          const mid = new THREE.Vector3().addVectors(linePts[i], linePts[i + 1]).multiplyScalar(0.5);
          const el = document.createElement('div');
          el.className = 'edge-label';
          el.innerText = `${dist.toFixed(0)} mm`;
          document.getElementById('labels-layer').appendChild(el);
          htmlLabels.push({ el, pos3D: mid });
        }
      }
    }

    function updateHTMLLabels() {
      if (!camera) return;
      const w = window.innerWidth, h = window.innerHeight;
      htmlLabels.forEach(item => {
        const v = item.pos3D.clone().project(camera);
        if (v.z > 1) item.el.style.display = 'none';
        else {
          item.el.style.display = 'flex';
          item.el.style.left = ((v.x * 0.5 + 0.5) * w) + 'px';
          item.el.style.top = ((-(v.y * 0.5) + 0.5) * h) + 'px';
        }
      });
    }

    function getPointOn4CornerPlane(uNorm, vNorm) {
      const offsetVec = localFrame.nDir.clone().multiplyScalar(planeOffset);
      const p1 = localFrame.C1.clone().add(offsetVec);
      const p2 = localFrame.C2.clone().add(offsetVec);
      const p3 = localFrame.C3.clone().add(offsetVec);
      const p4 = localFrame.C4.clone().add(offsetVec);

      const leftPt = new THREE.Vector3().lerpVectors(p1, p4, vNorm);
      const rightPt = new THREE.Vector3().lerpVectors(p2, p3, vNorm);
      return new THREE.Vector3().lerpVectors(leftPt, rightPt, uNorm);
    }

    function measureFrom4CornerPlane(hitPt, cx, cy) {
      const fromC1 = new THREE.Vector3().subVectors(hitPt, localFrame.C1);
      const distLeft = Math.max(0, fromC1.dot(localFrame.uDir));
      const distRight = Math.max(0, localFrame.length - distLeft);
      const distTop = Math.max(0, fromC1.dot(localFrame.vDir));
      const distBot = Math.max(0, localFrame.width - distTop);

      const uNorm = Math.min(1, Math.max(0, distLeft / (localFrame.length || 1)));
      const vNorm = Math.min(1, Math.max(0, distTop / (localFrame.width || 1)));

      const planePt = getPointOn4CornerPlane(uNorm, vNorm);
      const dropDepth = hitPt.distanceTo(planePt);

      document.getElementById('hud-probe-depth').innerText = dropDepth.toFixed(1) + ' mm';
      document.getElementById('hud-dist-left').innerText = distLeft.toFixed(0);
      document.getElementById('hud-dist-right').innerText = distRight.toFixed(0);
      document.getElementById('hud-dist-top').innerText = distTop.toFixed(0);
      document.getElementById('hud-dist-bot').innerText = distBot.toFixed(0);

      if (cx !== undefined && cy !== undefined) {
        const pin = document.getElementById('touch-pin');
        pin.style.left = cx + 'px'; pin.style.top = cy + 'px'; pin.style.display = 'block';
      }

      while (probeGroup.children.length > 0) probeGroup.remove(probeGroup.children[0]);
      probeGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([hitPt, planePt]),
        new THREE.LineBasicMaterial({ color: 0xfacc15, linewidth: 3 })
      ));

      const leftEdgePt = getPointOn4CornerPlane(0, vNorm);
      const rightEdgePt = getPointOn4CornerPlane(1, vNorm);
      const topEdgePt = getPointOn4CornerPlane(uNorm, 0);
      const botEdgePt = getPointOn4CornerPlane(uNorm, 1);

      const crossMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.9 });
      probeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([leftEdgePt, rightEdgePt]), crossMat));
      probeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([topEdgePt, botEdgePt]), crossMat));
    }

    function snapToNearestVertex(hitPoint) {
      if (!fPlateMesh && !plateMesh) return hitPoint;
      const pos = plateMesh.geometry.attributes.position.array;
      let bestDistSq = Infinity;
      const bestPt = hitPoint.clone(), tmp = new THREE.Vector3();

      for (let i = 0; i < pos.length; i += 3) {
        tmp.set(pos[i], pos[i + 1], pos[i + 2]);
        const dSq = tmp.distanceToSquared(hitPoint);
        if (dSq < bestDistSq) { bestDistSq = dSq; bestPt.copy(tmp); }
      }
      return (Math.sqrt(bestDistSq) < 55) ? bestPt : hitPoint;
    }

    function updateMagnifier(cx, cy) {
      const magEl = document.getElementById('magnifier');
      const magCanvas = document.getElementById('mag-canvas');
      magEl.style.display = 'block';
      magEl.style.left = cx + 'px';
      magEl.style.top = cy + 'px';

      const ctx = magCanvas.getContext('2d');
      const srcCanvas = renderer.domElement;
      const dpr = renderer.getPixelRatio();
      const rect = srcCanvas.getBoundingClientRect();

      const sx = (cx - rect.left) * dpr;
      const sy = (cy - rect.top) * dpr;
      const zoomSample = 48 * dpr;

      ctx.clearRect(0, 0, magCanvas.width, magCanvas.height);
      ctx.drawImage(srcCanvas, sx - zoomSample / 2, sy - zoomSample / 2, zoomSample, zoomSample, 0, 0, magCanvas.width, magCanvas.height);
    }

    function setupCanvasInteractions() {
      const dom = renderer.domElement;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let isPickingDrag = false;
      let downX = 0, downY = 0, downTime = 0;

      dom.addEventListener('pointerdown', (e) => {
        downX = e.clientX; downY = e.clientY; downTime = Date.now();
        if (interactionMode === 'corners' && e.isPrimary) {
          isPickingDrag = true;
          controls.enabled = false;
          updateMagnifier(e.clientX, e.clientY);
        }
      });

      dom.addEventListener('pointermove', (e) => {
        if (isPickingDrag && interactionMode === 'corners') {
          updateMagnifier(e.clientX, e.clientY);
        }
      });

      dom.addEventListener('pointerup', (e) => {
        if (isPickingDrag && interactionMode === 'corners') {
          isPickingDrag = false;
          document.getElementById('magnifier').style.display = 'none';
          controls.enabled = true;
          handlePlateTap(e.clientX, e.clientY, raycaster, mouse);
          return;
        }
        if (Math.hypot(e.clientX - downX, e.clientY - downY) < 10 && (Date.now() - downTime) < 400) {
          handlePlateTap(e.clientX, e.clientY, raycaster, mouse);
        }
      });

      dom.addEventListener('pointercancel', () => {
        isPickingDrag = false;
        document.getElementById('magnifier').style.display = 'none';
        controls.enabled = true;
      });
    }

    function handlePlateTap(cx, cy, raycaster, mouse) {
      if (!plateMesh) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((cx - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((cy - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObject(plateMesh, false);
      if (hits.length === 0) return;

      const hitPt = hits[0].point;

      if (interactionMode === 'corners') {
        const snapped = snapToNearestVertex(hitPt);
        if (manualCorners.length >= 4) manualCorners = [];
        manualCorners.push(snapped);
        applyCornersToFrame(manualCorners);

        if (manualCorners.length < 4) {
          document.getElementById('mode-banner').innerText = `📍 Drag & release on Corner ${manualCorners.length + 1} of 4`;
        } else {
          document.getElementById('mode-banner').innerText = `✅ 4-Corner Sight Mesh Ready! Tap plate to measure`;
          setMode('measure');
        }
        return;
      }

      if (manualCorners.length < 4) {
        document.getElementById('mode-banner').innerText = `⚠️ Pick all 4 corners first!`;
        return;
      }

      lastHitPt = hitPt.clone(); lastScreenX = cx; lastScreenY = cy;
      measureFrom4CornerPlane(hitPt, cx, cy);
    }

    function generateStations() {
      while (stationsGroup.children.length > 0) stationsGroup.remove(stationsGroup.children[0]);
      generatedTemplates = [];
      if (!plateMesh || manualCorners.length < 4) return;

      const interval = parseFloat(document.getElementById('inp-interval').value) || 300;
      const woodMargin = parseFloat(document.getElementById('inp-wood-margin').value) || 100;
      const sliceMode = document.getElementById('inp-slice-axis').value;
      const sliceDir = (sliceMode === 'u') ? localFrame.uDir : localFrame.vDir;
      const span = (sliceMode === 'u') ? localFrame.length : localFrame.width;

      const listEl = document.getElementById('template-export-list');
      listEl.innerHTML = '';
      let idx = 1;

      for (let d = interval / 2; d < span; d += interval) {
        const cutPlanePos = localFrame.C1.clone().addScaledVector(sliceDir, d);
        const cutPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(sliceDir, cutPlanePos);
        const segs = sliceMesh(plateMesh, cutPlane);
        if (segs.length < 2) continue;

        const pts = sortPoints(segs);
        if (pts.length < 2) continue;

        stationsGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(pts),
          new THREE.LineBasicMaterial({ color: 0xfacc15, linewidth: 2 })
        ));

        const tmplName = `${sliceMode === 'u' ? 'Stn' : 'WL'}_${idx}_${Math.round(d)}mm`;
        generatedTemplates.push({ name: tmplName, pts, margin: woodMargin });

        const div = document.createElement('div');
        div.className = 'tmpl-item';
        div.innerHTML = `<span><b>${tmplName}</b></span><button class="tmpl-dxf-btn" onclick="exportDXF(${generatedTemplates.length - 1})">Download DXF</button>`;
        listEl.appendChild(div);
        idx++;
      }
    }

    function sliceMesh(mesh, plane) {
      const pos = mesh.geometry.attributes.position.array;
      const segments = [];
      for (let i = 0; i < pos.length; i += 9) {
        const a = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
        const b = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
        const c = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
        const da = plane.distanceToPoint(a), db = plane.distanceToPoint(b), dc = plane.distanceToPoint(c);
        const pts = [];
        if (da * db < 0) pts.push(new THREE.Vector3().lerpVectors(a, b, da / (da - db)));
        if (db * dc < 0) pts.push(new THREE.Vector3().lerpVectors(b, c, db / (db - dc)));
        if (dc * da < 0) pts.push(new THREE.Vector3().lerpVectors(c, a, dc / (dc - da)));
        if (pts.length === 2) segments.push({ a: pts[0], b: pts[1] });
      }
      return segments;
    }

    function sortPoints(segs) {
      const pts = [segs[0].a, segs[0].b];
      const pool = segs.slice(1);
      while (pool.length > 0) {
        const tip = pts[pts.length - 1];
        let found = -1, rev = false;
        for (let i = 0; i < pool.length; i++) {
          if (tip.distanceTo(pool[i].a) < 1.5) { found = i; rev = false; break; }
          if (tip.distanceTo(pool[i].b) < 1.5) { found = i; rev = true; break; }
        }
        if (found !== -1) { const s = pool.splice(found, 1)[0]; pts.push(rev ? s.a : s.b); }
        else break;
      }
      return pts;
    }

    window.exportDXF = function(idx) {
      const item = generatedTemplates[idx];
      if (!item) return;
      const pts3D = item.pts, origin = pts3D[0], endPt = pts3D[pts3D.length - 1];
      const chord = new THREE.Vector3().subVectors(endPt, origin).normalize();
      const pts2D = pts3D.map(p => {
        const diff = new THREE.Vector3().subVectors(p, origin);
        return { x: diff.dot(chord), y: diff.dot(localFrame.nDir) };
      });
      const baseLine = Math.min(...pts2D.map(p => p.y)) - item.margin;

      let dxf = "0\nSECTION\n2\nENTITIES\n";
      for (let i = 0; i < pts2D.length - 1; i++) {
        dxf += `0\nLINE\n8\nPLATE_CURVE\n10\n${pts2D[i].x.toFixed(2)}\n20\n${pts2D[i].y.toFixed(2)}\n11\n${pts2D[i+1].x.toFixed(2)}\n21\n${pts2D[i+1].y.toFixed(2)}\n`;
      }
      const s = pts2D[0], e = pts2D[pts2D.length - 1];
      dxf += `0\nLINE\n8\nWOOD_BASE\n10\n${s.x.toFixed(2)}\n20\n${s.y.toFixed(2)}\n11\n${s.x.toFixed(2)}\n21\n${baseLine.toFixed(2)}\n`;
      dxf += `0\nLINE\n8\nWOOD_BASE\n10\n${e.x.toFixed(2)}\n20\n${e.y.toFixed(2)}\n11\n${e.x.toFixed(2)}\n21\n${baseLine.toFixed(2)}\n`;
      dxf += `0\nLINE\n8\nWOOD_BASE\n10\n${s.x.toFixed(2)}\n20\n${baseLine.toFixed(2)}\n11\n${e.x.toFixed(2)}\n21\n${baseLine.toFixed(2)}\n0\nENDSEC\n0\nEOF\n`;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([dxf], { type: 'application/dxf' }));
      a.download = `${item.name}.dxf`;
      a.click();
    };

    function setMode(mode) {
      interactionMode = mode;
      const btnMeasure = document.getElementById('btn-mode-measure');
      const btnCorners = document.getElementById('btn-mode-corners');
      const banner = document.getElementById('mode-banner');

      btnMeasure.classList.remove('active');
      btnCorners.classList.remove('corner-active');

      if (mode === 'measure') {
        btnMeasure.classList.add('active');
        banner.innerText = '📏 Tap plate to measure drop & edge distances';
        banner.style.borderColor = '#0284c7'; banner.style.color = '#38bdf8';
      } else {
        btnCorners.classList.add('corner-active');
        manualCorners = [];
        applyCornersToFrame([]);
        while (probeGroup.children.length > 0) probeGroup.remove(probeGroup.children[0]);
        document.getElementById('touch-pin').style.display = 'none';
        banner.innerText = '📍 Zoom in, touch & release on Corner 1 of 4';
        banner.style.borderColor = '#10b981'; banner.style.color = '#6ee7b7';
      }
    }

    function updateSideOffset(val) {
      planeOffset = Math.max(0, Math.min(500, val));
      document.getElementById('side-offset-slider').value = planeOffset;
      document.getElementById('side-offset-val').innerText = planeOffset + 'mm';
      if (manualCorners.length === 4) {
        buildExact4CornerMesh();
        if (lastHitPt) measureFrom4CornerPlane(lastHitPt, lastScreenX, lastScreenY);
      }
    }

    function setupUI() {
      document.getElementById('btn-mode-measure').addEventListener('click', () => setMode('measure'));
      document.getElementById('btn-mode-corners').addEventListener('click', () => setMode('corners'));

      document.getElementById('side-offset-slider').addEventListener('input', (e) => updateSideOffset(parseFloat(e.target.value) || 0));
      document.getElementById('btn-offset-up').addEventListener('click', () => updateSideOffset(planeOffset + 10));
      document.getElementById('btn-offset-down').addEventListener('click', () => updateSideOffset(planeOffset - 10));

      const btnHud = document.getElementById('btn-toggle-hud');
      const hud = document.getElementById('probe-hud');
      const sidePanel = document.getElementById('side-offset-panel');
      btnHud.addEventListener('click', () => {
        const isHidden = hud.classList.toggle('hidden');
        sidePanel.classList.toggle('hidden', isHidden);
        btnHud.innerText = isHidden ? '👁️ Show HUD' : '👁️ Hide HUD';
      });

      const drawer = document.getElementById('settings-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      const openDrawer = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
      const closeDrawer = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };

      document.getElementById('btn-open-settings').addEventListener('click', openDrawer);
      document.getElementById('btn-close-settings').addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);

      document.getElementById('btn-undo-corner').addEventListener('click', () => {
        if (manualCorners.length > 0) {
          manualCorners.pop();
          applyCornersToFrame(manualCorners);
          interactionMode = 'corners';
          document.getElementById('btn-mode-corners').classList.add('corner-active');
          document.getElementById('btn-mode-measure').classList.remove('active');
          document.getElementById('mode-banner').innerText = `📍 Drag & release on Corner ${manualCorners.length + 1} of 4`;
        }
      });

      document.getElementById('btn-clear-corners').addEventListener('click', () => { setMode('corners'); closeDrawer(); });
      document.getElementById('btn-recalc').addEventListener('click', () => { generateStations(); closeDrawer(); });
      document.getElementById('btn-toggle-plane').addEventListener('click', () => { if (datumPlaneMesh) datumPlaneMesh.visible = !datumPlaneMesh.visible; });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
